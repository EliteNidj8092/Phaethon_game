<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .blade { fill: none; stroke: #ff6b80; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hilt { fill: none; stroke: #c0c0d0; stroke-width: 2.5; stroke-linecap: round; }
    .guard { fill: none; stroke: #c0c0d0; stroke-width: 2; stroke-linecap: round; }
    @keyframes clash { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    svg:hover .sword-left { animation: clash .8s ease-in-out infinite; transform-origin: 12px 12px; }
    svg:hover .sword-right { animation: clash .8s ease-in-out infinite reverse; transform-origin: 12px 12px; }
  </style>
  <g class="sword-left">
    <path class="blade" d="M16 2l-4 4 6 6 4-4z"/>
    <path class="blade" d="M17 5l-5 5"/>
    <path class="hilt" d="M12 8l-3 3"/>
    <path class="guard" d="M14 6l3-3"/>
    <path class="hilt" d="M8.5 11.5l1.5 3"/>
  </g>
  <g class="sword-right">
    <path class="blade" d="M2 16l4-4 6 6-4 4z"/>
    <path class="blade" d="M5 17l5-5"/>
    <path class="hilt" d="M8 12l-3 3"/>
    <path class="guard" d="M14 18l-3 3"/>
    <path class="hilt" d="M11.5 15.5l3 1.5"/>
  </g>
</svg>
