<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes activate {
      0%,100% { opacity: 0.3; stroke-width: 1; }
      40% { opacity: 1; stroke-width: 2.5; }
    }
    .act { animation: activate 1s ease-in-out infinite; }
    .flash { animation: activate 1s ease-in-out 0.2s infinite; }
  </style>
  <path d="M4,6 L20,6 L20,15 Q20,20 12,22 Q4,20 4,15 Z" fill="none" stroke="#ff6b80" stroke-width="1.5"/>
  <path d="M4,6 L20,6 L20,15 Q20,20 12,22 Q4,20 4,15 Z" fill="none" stroke="#ff6b80" stroke-width="1" class="act"/>
  <polygon points="12,4 13.5,8.5 11,7 13.5,11 10.5,7.5 12.5,12 10,8 12,14" fill="none" stroke="#ffcc00" stroke-width="1.2" stroke-linejoin="round" class="flash"/>
  <polygon points="12,4 13.5,8.5 11,7 13.5,11 10.5,7.5 12.5,12 10,8 12,14" fill="#ffcc00" opacity="0.4" class="flash"/>
</svg>
