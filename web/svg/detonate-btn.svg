<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .detonate-triangle { fill: none; stroke: #ff6040; stroke-width: 2; stroke-linejoin: round; }
    .detonate-mark { fill: #ff6040; }
    .detonate-spark { fill: none; stroke: #ff6040; stroke-width: 1.5; stroke-linecap: round; }
    @keyframes flash { 0%,100% { filter: drop-shadow(0 0 2px #ff6040); } 50% { filter: drop-shadow(0 0 6px #ff6040); } }
    svg:hover .detonate-group { animation: flash .6s ease-in-out infinite; }
  </style>
  <g class="detonate-group">
    <path class="detonate-triangle" d="M12 4l9 16H3z"/>
    <rect class="detonate-mark" x="11" y="10" width="2" height="5" rx=".5"/>
    <circle class="detonate-mark" cx="12" cy="17.5" r="1"/>
    <path class="detonate-spark" d="M7 3l.5 2.5M17 3l-.5 2.5M12 1v1.5M5 6l2 .5M19 6l-2 .5"/>
  </g>
</svg>
