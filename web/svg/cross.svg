<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .crossmark { fill: none; stroke: #ff3b5c; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 35; stroke-dashoffset: 35; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    svg .crossmark { animation: draw .6s ease-out forwards; }
    svg:hover .crossmark { animation: draw .6s ease-out forwards; }
  </style>
  <path class="crossmark" d="M6 6l12 12M18 6L6 18"/>
</svg>
