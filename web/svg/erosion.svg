<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes crack-draw {
      0% { stroke-dashoffset:40; }
      100% { stroke-dashoffset:0; }
    }
    @keyframes spread {
      0%,100% { stroke-width:.6; opacity:.5; }
      50% { stroke-width:1.5; opacity:.9; }
    }
    .crack .line { animation:crack-draw 2s ease-in forwards; stroke-dasharray:40; }
    .spread .line { animation:spread 1.2s ease-in-out infinite; }
  </style>
  <g>
    <rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="#a040c8" stroke-width=".6" opacity=".3"/>
    <line class="line" x1="12" y1="12" x2="4" y2="5" stroke="#a040c8" stroke-width=".7" stroke-linecap="round"/>
    <line class="line" x1="12" y1="12" x2="20" y2="7" stroke="#a040c8" stroke-width=".7" stroke-linecap="round"/>
    <line class="line" x1="12" y1="12" x2="8" y2="20" stroke="#a040c8" stroke-width=".7" stroke-linecap="round"/>
    <line class="line" x1="8" y1="20" x2="5" y2="20.5" stroke="#a040c8" stroke-width=".5" stroke-linecap="round"/>
    <line class="line" x1="8" y1="20" x2="8.5" y2="22" stroke="#a040c8" stroke-width=".5" stroke-linecap="round"/>
    <line class="line" x1="12" y1="12" x2="17" y2="19" stroke="#a040c8" stroke-width=".7" stroke-linecap="round"/>
    <line class="line" x1="17" y1="19" x2="19" y2="21.5" stroke="#a040c8" stroke-width=".5" stroke-linecap="round"/>
    <line class="line" x1="4" y1="5" x2="2" y2="3" stroke="#a040c8" stroke-width=".5" stroke-linecap="round"/>
    <line class="line" x1="20" y1="7" x2="22" y2="4" stroke="#a040c8" stroke-width=".5" stroke-linecap="round"/>
    <circle cx="12" cy="12" r=".8" fill="#a040c8" opacity=".6"/>
  </g>
</svg>