<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes pulse-glow {
      0%,100% { opacity:.3; }
      50% { opacity:1; }
    }
    @keyframes spin {
      to { transform:rotate(360deg); }
    }
    .pulse .core { animation:pulse-glow 1.5s ease-in-out infinite; }
    .spin { animation:spin 6s linear infinite; transform-origin:12px 12px; }
  </style>
  <g class="spin">
    <polygon points="12,2 15,5.5 13.5,9 18,7.5 20.5,10.5 18.5,13.5 22,15 20,18 16.5,16.5 15,20.5 12,18 9,20.5 7.5,16.5 4,18 2,15 5.5,13.5 3.5,10.5 6,7.5 10.5,9 9,5.5" fill="none" stroke="#00b8ff" stroke-width="0.6" stroke-linejoin="round"/>
    <polygon points="12,4 14.5,7 13,10 17,8.5 19,11.2 17,14 20.5,15.5 18.8,17.8 15.5,16.3 14.5,19.5 12,17.5 9.5,19.5 8.5,16.3 5.2,17.8 3.5,15.5 7,14 5,11.2 7,8.5 11,10 9.5,7" fill="#00b8ff" opacity=".15"/>
    <line x1="12" y1="2" x2="12" y2="22" stroke="#5ce0ff" stroke-width="0.4" opacity=".5"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#5ce0ff" stroke-width="0.4" opacity=".5"/>
    <line x1="5.5" y1="5.5" x2="18.5" y2="18.5" stroke="#5ce0ff" stroke-width="0.4" opacity=".5"/>
    <line x1="18.5" y1="5.5" x2="5.5" y2="18.5" stroke="#5ce0ff" stroke-width="0.4" opacity=".5"/>
  </g>
  <circle cx="12" cy="12" r="2.5" fill="#5ce0ff" class="core" opacity=".4"/>
  <circle cx="12" cy="12" r="1.2" fill="#00b8ff"/>
  <polygon points="12,9 13.5,11 15,9 14,12 16,13.5 13,14 12,16 11,14 8,13.5 10,12 9,9 10.5,11" fill="#5ce0ff" opacity=".6"/>
</svg>
