<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .link { fill:none; stroke:#80b0ff; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .link-a { transform-origin:8px 16px; }
      .link-b { transform-origin:16px 8px; }
      .connect .link-a { animation: slideA 1s ease-in-out infinite alternate; }
      .connect .link-b { animation: slideB 1s ease-in-out infinite alternate; }
      @keyframes slideA {
        0% { transform:translate(0,0); }
        100% { transform:translate(-2px,2px); }
      }
      @keyframes slideB {
        0% { transform:translate(0,0); }
        100% { transform:translate(2px,-2px); }
      }
    </style>
  </defs>
  <g class="connect">
    <g class="link-a">
      <rect x="3" y="11" width="8" height="6" rx="3" ry="3"/>
      <line x1="3" y1="14" x2="11" y2="14"/>
    </g>
    <g class="link-b">
      <rect x="13" y="7" width="8" height="6" rx="3" ry="3"/>
      <line x1="21" y1="10" x2="13" y2="10"/>
    </g>
  </g>
</svg>