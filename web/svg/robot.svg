<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .robot-head { fill: none; stroke: #9cff7a; stroke-width: 2; stroke-linejoin: round; }
    .robot-eye { fill: #9cff7a; }
    .robot-antenna { fill: none; stroke: #9cff7a; stroke-width: 1.5; stroke-linecap: round; }
    @keyframes blink { 0%,94%,100% { r: 1.5; } 95%,97% { r: .3; } }
    svg:hover .eye { animation: blink 2s ease-in-out infinite; }
  </style>
  <rect class="robot-head" x="5" y="8" width="14" height="12" rx="3"/>
  <path class="robot-antenna" d="M12 8V4.5"/>
  <circle class="robot-eye eye" cx="9.5" cy="13.5" r="1.5"/>
  <circle class="robot-eye eye" cx="14.5" cy="13.5" r="1.5"/>
  <circle class="robot-antenna" cx="12" cy="4.5" r="1.5"/>
  <path class="robot-head" d="M9 17h6"/>
</svg>
