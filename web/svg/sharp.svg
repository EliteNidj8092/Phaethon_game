<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes flash {
      0%,100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .flash { animation: flash 1.2s ease-in-out infinite; }
  </style>
  <polygon points="12,1 14,9 12,8 10,9" fill="#5ce0ff"/>
  <polygon points="12,1 14,9 12,8 10,9" fill="#fff" class="flash" opacity="0.3"/>
  <rect x="10.5" y="9" width="3" height="2" rx="0.5" fill="#d4d4d4"/>
  <rect x="9" y="11" width="6" height="1" rx="0.5" fill="#c0c0c0"/>
  <rect x="10.5" y="12" width="3" height="1.5" rx="0.5" fill="#a0a0a0"/>
  <circle cx="12" cy="14.5" r="1" fill="#a0a0a0"/>
</svg>
