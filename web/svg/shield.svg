<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes flash-border {
      0%,100% { stroke:#9cff7a; }
      50% { stroke:#ffffff; stroke-width:1.8; }
    }
    @keyframes breathe {
      0%,100% { transform:scale(1); }
      50% { transform:scale(1.08); }
    }
    .flash .shield { animation:flash-border .3s ease-in-out infinite; }
    .breathe { animation:breathe 2s ease-in-out infinite; transform-origin:12px 13px; }
  </style>
  <g class="breathe">
    <path class="shield" d="M12 2L3 5v7c0 4.5 3.5 8.5 9 10 5.5-1.5 9-5.5 9-10V5L12 2z" fill="none" stroke="#9cff7a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M12 2L3 5v7c0 4.5 3.5 8.5 9 10 5.5-1.5 9-5.5 9-10V5L12 2z" fill="#9cff7a" opacity=".12"/>
    <line x1="8.5" y1="10" x2="15.5" y2="17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
    <line x1="15.5" y1="10" x2="8.5" y2="17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
    <circle cx="12" cy="13.5" r="1.8" fill="none" stroke="#9cff7a" stroke-width="0.8" opacity=".6"/>
  </g>
</svg>