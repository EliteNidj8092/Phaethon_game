<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .circle { fill:none; stroke:#5ce0ff; stroke-width:1.5; }
      .letter { fill:#5ce0ff; stroke:none; font-family:Georgia,serif; font-weight:bold; font-size:10px; text-anchor:middle; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin:12px 12px; }
      @keyframes pulse {
        0%,100% { transform:scale(1); opacity:0.6; stroke-width:1.5; }
        50% { transform:scale(1.06); opacity:1; stroke-width:2; }
      }
    </style>
  </defs>
  <circle class="circle pulse" cx="12" cy="12" r="10"/>
  <text x="12" y="16.5" class="letter">i</text>
</svg>