<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-3px); }
    }
    @keyframes shatter {
      0% { opacity:1; transform:scale(1); }
      100% { opacity:0; transform:scale(.6); }
    }
    @keyframes spin {
      to { transform:rotate(360deg); }
    }
    .float { animation:float 2s ease-in-out infinite; }
    .shatter { animation:shatter .6s ease-in forwards; }
    .spin { animation:spin 3s linear infinite; transform-origin:10px 12px; }
  </style>
  <g>
    <path d="M10 2 Q6 6 5.5 10 Q4 12 3 13 Q5 12.5 6 12 Q5 15 3.5 17 Q6 16 7 14.5 Q6 18 5 20.5 Q8 19 9 16 Q9 20 10 22 Q11 18 11 14 Q13 18 12.5 21 Q13.5 17 14 13.5 Q15 17 16 19 Q14.5 15.5 15 12.5 Q17 14 18.5 15 Q16.5 12.5 17 11 Q18 9 19 8 Q17 8.5 16 9 Q17 7 17.5 5.5 Q15 7 14 8.5 Q15 5 15 3 Q13 5 12 7 Q11 5 10 2z" fill="#5ce0ff" opacity=".8" stroke="#5ce0ff" stroke-width=".3"/>
    <line x1="10" y1="2" x2="10" y2="22" stroke="#5ce0ff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>