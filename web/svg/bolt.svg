<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .bolt { fill:#ffcc00; stroke:none; transform-origin:center; }
      .flash { animation: flash 0.8s ease-in-out infinite alternate; }
      @keyframes flash {
        0% { opacity:0.3; filter:drop-shadow(0 0 0px #ffcc00); }
        100% { opacity:1; filter:drop-shadow(0 0 4px #ffcc00); }
      }
    </style>
  </defs>
  <polygon class="bolt flash" points="14,2 8,13 11,13 10,22 16,11 13,11 16,5"/>
</svg>