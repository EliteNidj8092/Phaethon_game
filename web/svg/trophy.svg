    @keyframes shine { 0%,100% { filter: drop-shadow(0 0 1px #ffcc00); } 50% { filter: drop-shadow(0 0 5px #ffd700); } }
    svg:hover .trophy-group { animation: shine 1.5s ease-in-out infinite; }
  </style>
