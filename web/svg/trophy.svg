<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .trophy-body { fill: none; stroke: #ffcc00; stroke-width: 2; stroke-linejoin: round; }
    .trophy-rim { fill: none; stroke: #ffdd44; stroke-width: 1.5; stroke-linecap: round; }
