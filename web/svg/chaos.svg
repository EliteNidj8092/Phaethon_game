<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes intensify {
      0%,100% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spin { animation: spin 6s linear infinite; transform-origin: 12px 12px; }
    .intensify { animation: spin 1s linear infinite; transform-origin: 12px 12px; }
  </style>
  <g class="spin">
    <path d="M12,12 Q14,8 15,5 Q14,6 12,7 Q10,6 9,5 Q10,8 12,12" fill="none" stroke="#a060d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12,12 Q16,11 19,10 Q18,12 17,12 Q18,13 19,14 Q16,13 12,12" fill="none" stroke="#a060d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12,12 Q10,16 9,19 Q11,18 12,17 Q13,18 15,19 Q14,16 12,12" fill="none" stroke="#a060d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12,12 Q8,11 5,10 Q6,12 7,12 Q6,13 5,14 Q8,13 12,12" fill="none" stroke="#a060d0" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2" fill="#a060d0"/>
  </g>
</svg>
