<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes target-expand {
      0% { r:6; opacity:.8; stroke-width:1; }
      100% { r:11; opacity:0; stroke-width:.3; }
    }
    @keyframes lockon-snap {
      0% { transform:scale(1.3); }
      60% { transform:scale(.85); }
      100% { transform:scale(1); }
    }
    .target .outer { animation:target-expand 1.2s ease-out infinite; }
    .lockon { animation:lockon-snap .4s ease-out forwards; transform-origin:12px 12px; }
  </style>
  <g>
    <circle cx="12" cy="12" r="9" fill="none" stroke="#ff3b5c" stroke-width=".5" opacity=".4"/>
    <circle cx="12" cy="12" r="6" fill="none" stroke="#ff3b5c" stroke-width=".7" opacity=".6"/>
    <circle cx="12" cy="12" r="3" fill="none" stroke="#ff3b5c" stroke-width="1"/>
    <circle cx="12" cy="12" r="1.2" fill="#ff3b5c"/>
    <circle class="outer" cx="12" cy="12" r="6" fill="none" stroke="#ff3b5c" stroke-width="1" opacity="0"/>
    <line x1="12" y1="2" x2="12" y2="7" stroke="#ff3b5c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="17" x2="12" y2="22" stroke="#ff3b5c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="12" x2="7" y2="12" stroke="#ff3b5c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="12" x2="22" y2="12" stroke="#ff3b5c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5.6" y1="5.6" x2="8.5" y2="8.5" stroke="#ff3b5c" stroke-width=".5" stroke-linecap="round" opacity=".4"/>
    <line x1="15.5" y1="15.5" x2="18.4" y2="18.4" stroke="#ff3b5c" stroke-width=".5" stroke-linecap="round" opacity=".4"/>
    <line x1="18.4" y1="5.6" x2="15.5" y2="8.5" stroke="#ff3b5c" stroke-width=".5" stroke-linecap="round" opacity=".4"/>
    <line x1="8.5" y1="15.5" x2="5.6" y2="18.4" stroke="#ff3b5c" stroke-width=".5" stroke-linecap="round" opacity=".4"/>
  </g>
</svg>