<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes lock-open {
      0% { transform:rotate(0); }
      50% { transform:rotate(-8deg); }
      100% { transform:rotate(0); }
    }
    @keyframes seal-glow {
      0%,100% { opacity:0; r:7; stroke-width:.5; }
      50% { opacity:.6; r:9; stroke-width:1.2; }
    }
    .lock { animation:lock-open .5s ease-in-out; transform-origin:12px 15px; }
    .seal .ring { animation:seal-glow 1.5s ease-in-out infinite; }
  </style>
  <g>
    <path d="M7.5 10V7.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5V10" fill="none" stroke="#c0c0d0" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="5" y="10" width="14" height="11" rx="2.5" fill="#c0c0d0" opacity=".25" stroke="#c0c0d0" stroke-width="1.5"/>
    <circle cx="12" cy="15.5" r="2.2" fill="none" stroke="#c0c0d0" stroke-width="1"/>
    <circle cx="12" cy="15.5" r=".8" fill="#c0c0d0"/>
    <line x1="12" y1="16.3" x2="12" y2="18.5" stroke="#c0c0d0" stroke-width="1" stroke-linecap="round"/>
    <circle class="ring" cx="12" cy="15.5" r="7" fill="none" stroke="#c0c0d0" opacity="0"/>
  </g>
</svg>