<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .star { fill:#ffcc00; stroke:none; transform-origin:center; }
      .twinkle { animation: twinkle 1.2s ease-in-out infinite alternate; }
      @keyframes twinkle {
        0% { transform:scale(1); opacity:0.6; }
        50% { transform:scale(1.15); opacity:1; }
        100% { transform:scale(0.85); opacity:0.5; }
      }
    </style>
  </defs>
  <polygon class="star twinkle" points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/>
</svg>