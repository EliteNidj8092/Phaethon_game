<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes tick {
      0%,100% { transform: rotate(0deg); }
      49%,51% { transform: rotate(-6deg); }
    }
    .rev { animation: reverse 6s linear infinite; transform-origin: 12px 12px; }
    .tick { animation: tick 1s steps(1) infinite; transform-origin: 12px 12px; }
  </style>
  <circle cx="12" cy="12" r="10" fill="none" stroke="#80a0ff" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="1" fill="#80a0ff"/>
  <line x1="12" y1="12" x2="12" y2="5" stroke="#80a0ff" stroke-width="1.5" stroke-linecap="round" class="rev"/>
  <line x1="12" y1="12" x2="16" y2="12" stroke="#80a0ff" stroke-width="1" stroke-linecap="round" class="tick"/>
  <line x1="12" y1="2" x2="12" y2="3.5" stroke="#80a0ff" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="20.5" x2="12" y2="22" stroke="#80a0ff" stroke-width="1" stroke-linecap="round"/>
  <line x1="2" y1="12" x2="3.5" y2="12" stroke="#80a0ff" stroke-width="1" stroke-linecap="round"/>
  <line x1="20.5" y1="12" x2="22" y2="12" stroke="#80a0ff" stroke-width="1" stroke-linecap="round"/>
</svg>
