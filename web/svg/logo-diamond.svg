<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotate { animation: rotate 20s linear infinite; transform-origin: 12px 12px; }
  </style>
  <g class="rotate">
    <polygon points="12,1 23,12 12,23 1,12" fill="#00b8ff" stroke="#00b8ff" stroke-width="0.3"/>
    <polygon points="12,1 12,12 23,12" fill="#009fe0" opacity="0.6"/>
    <polygon points="12,1 1,12 12,12" fill="#00d0ff" opacity="0.5"/>
    <polygon points="12,23 12,12 23,12" fill="#0088c0" opacity="0.5"/>
    <polygon points="12,23 1,12 12,12" fill="#00c8f8" opacity="0.4"/>
    <polygon points="12,5 17,12 12,12" fill="#fff" opacity="0.35"/>
    <polygon points="12,5 7,12 12,12" fill="#fff" opacity="0.15"/>
    <polygon points="12,19 17,12 12,12" fill="#fff" opacity="0.1"/>
    <line x1="12" y1="1" x2="12" y2="23" stroke="#fff" stroke-width="0.4" opacity="0.25"/>
    <line x1="1" y1="12" x2="23" y2="12" stroke="#fff" stroke-width="0.4" opacity="0.25"/>
  </g>
</svg>
