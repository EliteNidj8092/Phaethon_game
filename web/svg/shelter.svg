<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes pulse {
      0%,100% { opacity: 0.2; stroke-width: 1; }
      50% { opacity: 1; stroke-width: 2; }
    }
    .pulse { animation: pulse 0.6s ease-in-out infinite; }
  </style>
  <path d="M4,6 L20,6 L20,15 Q20,20 12,22 Q4,20 4,15 Z" fill="none" stroke="#ffcc00" stroke-width="1.5"/>
  <path d="M4,6 L20,6 L20,15 Q20,20 12,22 Q4,20 4,15 Z" fill="none" stroke="#fff6b0" stroke-width="1" class="pulse"/>
  <line x1="8" y1="7" x2="8" y2="12" stroke="#ffcc00" stroke-width="0.8"/>
  <line x1="12" y1="7" x2="12" y2="12" stroke="#ffcc00" stroke-width="0.8"/>
  <line x1="16" y1="7" x2="16" y2="12" stroke="#ffcc00" stroke-width="0.8"/>
</svg>
