<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .body { fill:none; stroke:#5ce0ff; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .fill { fill:#5ce0ff; stroke:none; }
      .btn { fill:#5ce0ff; transform-origin:center; }
      .press .btn-a { animation: pressA 0.6s ease-in-out infinite alternate; }
      .press .btn-b { animation: pressB 0.6s ease-in-out 0.2s infinite alternate; }
      @keyframes pressA {
        0% { transform:scale(1); }
        100% { transform:scale(0.7) translateY(0.5px); }
      }
      @keyframes pressB {
        0% { transform:scale(1); }
        100% { transform:scale(0.7) translateY(0.5px); }
      }
    </style>
  </defs>
  <g class="press">
    <rect class="body" x="2" y="5" width="20" height="13" rx="4" ry="4"/>
    <rect class="body" x="1" y="4.5" width="3" height="4" rx="1"/>
    <rect class="body" x="20" y="4.5" width="3" height="4" rx="1"/>
    <line class="body" x1="10" y1="14" x2="14" y2="14"/>
    <line class="body" x1="10" y1="17" x2="14" y2="17"/>
    <rect class="fill" x="6" y="8.5" width="1.5" height="4" rx="0.3"/>
    <rect class="fill" x="4.75" y="10" width="4" height="1.5" rx="0.3"/>
    <circle class="btn btn-a" cx="16" cy="10.5" r="1.5"/>
    <circle class="btn btn-b" cx="19" cy="9" r="1.2"/>
  </g>
</svg>