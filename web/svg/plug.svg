<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .body { fill:none; stroke:#ff6050; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .prong { fill:#ff6050; stroke:none; }
      .connected .body { stroke:#9cff7a; }
      .connected .prong { fill:#9cff7a; }
      .disconnect .prong-left { animation: pullL 0.8s ease-in-out infinite alternate; transform-origin:9px 18px; }
      .disconnect .prong-right { animation: pullR 0.8s ease-in-out infinite alternate; transform-origin:15px 18px; }
      @keyframes pullL {
        0% { transform:translate(0,0); }
        100% { transform:translate(-0.8px,1.5px); }
      }
      @keyframes pullR {
        0% { transform:translate(0,0); }
        100% { transform:translate(0.8px,1.5px); }
      }
    </style>
  </defs>
  <g class="disconnect">
    <rect class="body" x="7" y="4" width="10" height="6" rx="1.5"/>
    <rect x="9" y="6" width="6" height="2" rx="0.5" fill="#ff6050" class="prong"/>
    <rect class="prong prong-left" x="9" y="10" width="2" height="10" rx="0.5"/>
    <rect class="prong prong-right" x="13" y="10" width="2" height="10" rx="0.5"/>
    <path class="body" d="M4 18 Q12 22 20 18" stroke-width="1.2"/>
  </g>
</svg>