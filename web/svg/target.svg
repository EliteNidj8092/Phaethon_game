<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .ring { fill:none; stroke:#ff3b5c; stroke-width:1; transform-origin:center; }
      .dot { fill:#ff3b5c; stroke:none; }
      .acquire .r1 { animation: pulseR 1.5s ease-in-out infinite; }
      .acquire .r2 { animation: pulseR 1.5s ease-in-out 0.3s infinite; }
      .acquire .r3 { animation: pulseR 1.5s ease-in-out 0.6s infinite; }
      @keyframes pulseR {
        0%,100% { transform:scale(1); opacity:0.4; }
        50% { transform:scale(1.08); opacity:1; }
      }
    </style>
  </defs>
  <g class="acquire">
    <circle class="ring r3" cx="12" cy="12" r="11"/>
    <circle class="ring r2" cx="12" cy="12" r="7"/>
    <circle class="ring r1" cx="12" cy="12" r="3"/>
    <circle class="dot" cx="12" cy="12" r="1.2"/>
    <line class="ring" x1="12" y1="0" x2="12" y2="24"/>
    <line class="ring" x1="0" y1="12" x2="24" y2="12"/>
  </g>
</svg>