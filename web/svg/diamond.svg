<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes glow { 0%,100%{opacity:0.3;transform:scale(0.95)} 50%{opacity:0.8;transform:scale(1)} }
    .g{animation:glow 2s ease-in-out infinite;transform-origin:12px 12px}
  </style>
  <polygon points="12,2 22,12 12,22 2,12" fill="currentColor"/>
  <polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="2" class="g"/>
  <line x1="12" y1="2" x2="12" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <line x1="2" y1="12" x2="22" y2="12" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
</svg>
