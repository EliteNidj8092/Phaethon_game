<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes detonate {
      0% { transform:scale(0); opacity:0; }
      50% { opacity:1; }
      80% { opacity:.6; }
      100% { transform:scale(1.4); opacity:0; }
    }
    @keyframes rumble {
      0%,100% { transform:translate(0,0); }
      15% { transform:translate(.8px,-.6px); }
      30% { transform:translate(-.6px,.5px); }
      45% { transform:translate(.4px,-.3px); }
      60% { transform:translate(-.5px,.4px); }
      75% { transform:translate(.3px,-.4px); }
      90% { transform:translate(-.4px,.3px); }
    }
    .detonate .ring { animation:detonate 1s ease-out infinite; }
    .rumble { animation:rumble .3s ease-in-out infinite; }
  </style>
  <g>
    <circle cx="12" cy="12" r="3.5" fill="#ff6b30"/>
    <circle cx="12" cy="12" r="2" fill="#ffcc00"/>
    <circle cx="12" cy="12" r="1" fill="#fff" opacity=".7"/>
    <circle class="ring" cx="12" cy="12" r="4" fill="none" stroke="#ffcc00" stroke-width=".8" opacity="0"/>
    <g opacity=".8">
      <line x1="12" y1="2" x2="12" y2="6" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="18" x2="12" y2="22" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="12" x2="6" y2="12" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="18" y1="12" x2="22" y2="12" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="5" x2="7.5" y2="7.5" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16.5" y1="16.5" x2="19" y2="19" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="5" x2="16.5" y2="7.5" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="7.5" y1="16.5" x2="5" y2="19" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>