<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes breathe {
      0%,100% { transform:scale(1); }
      50% { transform:scale(1.06); }
    }
    @keyframes grow {
      0% { transform:scale(.5); opacity:.3; }
      100% { transform:scale(1); opacity:1; }
    }
    .breathe { animation:breathe 3s ease-in-out infinite; transform-origin:12px 18px; }
    .grow { animation:grow .8s ease-out forwards; transform-origin:12px 18px; }
  </style>
