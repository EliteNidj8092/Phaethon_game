<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes sway {
      0%,100% { transform:translateX(0); }
      25% { transform:translateX(2px); }
      75% { transform:translateX(-2px); }
    }
    @keyframes gust {
      0%,100% { transform:translateX(0); }
      50% { transform:translateX(4px); }
    }
    .sway .line1 { animation:sway 1.8s ease-in-out infinite; }
    .sway .line2 { animation:sway 1.8s ease-in-out .3s infinite; }
    .sway .line3 { animation:sway 1.8s ease-in-out .6s infinite; }
    .gust .line1 { animation:gust .6s ease-in-out infinite; }
    .gust .line2 { animation:gust .6s ease-in-out .15s infinite; }
    .gust .line3 { animation:gust .6s ease-in-out .3s infinite; }
  </style>
  <g>
    <path class="line1" d="M2 10 Q7 7 11 9 Q13 10 15 9 Q18 7.5 21 9" fill="none" stroke="#ff8c00" stroke-width="1.3" stroke-linecap="round"/>
    <path class="line2" d="M4 14 Q9 11 13 13 Q15 14 17 13 Q19 11.5 20 13" fill="none" stroke="#ff8c00" stroke-width="1.3" stroke-linecap="round"/>
    <path class="line3" d="M3 6 Q7 3.5 10 5.5 Q12 6.5 14 5.5 Q16.5 4 19 5.5" fill="none" stroke="#ff8c00" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>