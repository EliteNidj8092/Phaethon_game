<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .medal-disc { fill: none; stroke: #cd7f32; stroke-width: 2; }
    .medal-num { fill: #cd7f32; font: bold 7px sans-serif; text-anchor: middle; }
    .medal-ribbon { fill: none; stroke: #cd7f32; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes shine { 0%,100% { filter: drop-shadow(0 0 1px #cd7f32); } 50% { filter: drop-shadow(0 0 5px #daa520); } }
    svg:hover .medal-group { animation: shine 1.5s ease-in-out infinite; }
  </style>
  <g class="medal-group">
    <path class="medal-ribbon" d="M8 5l4 4 4-4"/>
    <path class="medal-ribbon" d="M15 5l-3 4V2l3 3"/>
    <path class="medal-ribbon" d="M9 5l3 4V2L9 5"/>
    <circle class="medal-disc" cx="12" cy="13" r="5.5"/>
    <text class="medal-num" x="12" y="15.5">3</text>
  </g>
</svg>
