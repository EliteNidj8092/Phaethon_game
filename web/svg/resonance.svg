<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes wave {
      0% { r: 1; opacity: 1; }
      100% { r: 11; opacity: 0; }
    }
    .w1 { animation: wave 2s ease-out infinite; }
    .w2 { animation: wave 2s ease-out 0.5s infinite; }
    .w3 { animation: wave 2s ease-out 1s infinite; }
    .w4 { animation: wave 2s ease-out 1.5s infinite; }
  </style>
  <circle cx="12" cy="12" r="1.5" fill="#9cff7a"/>
  <circle cx="12" cy="12" r="1" fill="none" stroke="#9cff7a" stroke-width="0.8" class="w1"/>
  <circle cx="12" cy="12" r="1" fill="none" stroke="#9cff7a" stroke-width="0.7" class="w2"/>
  <circle cx="12" cy="12" r="1" fill="none" stroke="#9cff7a" stroke-width="0.6" class="w3"/>
  <circle cx="12" cy="12" r="1" fill="none" stroke="#9cff7a" stroke-width="0.5" class="w4"/>
</svg>
