<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    @keyframes beat {
      0%,100% { transform: scale(0.8); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    .b1 { animation: beat 0.8s ease-in-out infinite; transform-origin: 12px 12px; }
    .b2 { animation: beat 0.8s ease-in-out 0.2s infinite; transform-origin: 12px 12px; }
    .b3 { animation: beat 0.8s ease-in-out 0.4s infinite; transform-origin: 12px 12px; }
    .b4 { animation: beat 0.8s ease-in-out 0.6s infinite; transform-origin: 12px 12px; }
  </style>
  <circle cx="12" cy="12" r="2" fill="#ff6040"/>
  <line x1="12" y1="2" x2="12" y2="8" stroke="#ff6040" stroke-width="2" stroke-linecap="round" class="b1"/>
  <line x1="22" y1="12" x2="16" y2="12" stroke="#ff6040" stroke-width="2" stroke-linecap="round" class="b2"/>
  <line x1="12" y1="22" x2="12" y2="16" stroke="#ff6040" stroke-width="2" stroke-linecap="round" class="b3"/>
  <line x1="2" y1="12" x2="8" y2="12" stroke="#ff6040" stroke-width="2" stroke-linecap="round" class="b4"/>
  <line x1="4.5" y1="4.5" x2="8.5" y2="8.5" stroke="#ff6040" stroke-width="1.5" stroke-linecap="round" class="b2"/>
  <line x1="19.5" y1="4.5" x2="15.5" y2="8.5" stroke="#ff6040" stroke-width="1.5" stroke-linecap="round" class="b3"/>
  <line x1="19.5" y1="19.5" x2="15.5" y2="15.5" stroke="#ff6040" stroke-width="1.5" stroke-linecap="round" class="b4"/>
  <line x1="4.5" y1="19.5" x2="8.5" y2="15.5" stroke="#ff6040" stroke-width="1.5" stroke-linecap="round" class="b1"/>
</svg>
